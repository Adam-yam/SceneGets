<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SceneGets</title>
<style>
  :root{
    --bg:#F2F2F7;
    --surface:#FFFFFF;
    --surface-2:#F2F2F7;
    --stroke:rgba(60,60,67,0.10);
    --divider:rgba(60,60,67,0.13);
    --text-1:#1C1C1E;
    --text-2:#6C6C70;
    --text-3:#AEAEB2;
    --accent:#5E5CE6;
    --accent-dim:rgba(94,92,230,0.12);
    --up:#FF3B30;
    --down:#007AFF;
    --status-ok:#34C759;
    --status-warn:#FF9500;
    --flat:#8E8E93;
    --sat:#0A84FF;
    --sun:#FF3B30;
    --blue:#007AFF;
    --pink:#FF2D55;
    --card-shadow:0 1px 2px rgba(0,0,0,0.03), 0 1px 8px rgba(0,0,0,0.03);
    --glass-bg:rgba(255,255,255,0.62);
    --glass-border:rgba(255,255,255,0.6);
    --glass-shadow:0 10px 30px rgba(0,0,0,0.12), 0 1px 1px rgba(255,255,255,0.5) inset;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Inter", "Pretendard", "Apple SD Gothic Neo", sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#000000;
      --surface:#1C1C1E;
      --surface-2:#2C2C2E;
      --stroke:rgba(255,255,255,0.07);
      --divider:rgba(255,255,255,0.09);
      --text-1:#FFFFFF;
      --text-2:#98989D;
      --text-3:#636366;
      --accent:#7D7AFF;
      --accent-dim:rgba(125,122,255,0.18);
      --up:#FF453A;
      --down:#0A84FF;
      --status-ok:#30D158;
      --status-warn:#FF9F0A;
      --flat:#8E8E93;
      --sat:#409CFF;
      --sun:#FF453A;
      --blue:#0A84FF;
      --pink:#FF375F;
      --card-shadow:none;
      --glass-bg:rgba(44,44,46,0.55);
      --glass-border:rgba(255,255,255,0.08);
      --glass-shadow:0 10px 30px rgba(0,0,0,0.55), 0 1px 1px rgba(255,255,255,0.05) inset;
    
    }
  }
  :root[data-theme="dark"]{
      --bg:#000000;
      --surface:#1C1C1E;
      --surface-2:#2C2C2E;
      --stroke:rgba(255,255,255,0.07);
      --divider:rgba(255,255,255,0.09);
      --text-1:#FFFFFF;
      --text-2:#98989D;
      --text-3:#636366;
      --accent:#7D7AFF;
      --accent-dim:rgba(125,122,255,0.18);
      --up:#FF453A;
      --down:#0A84FF;
      --status-ok:#30D158;
      --status-warn:#FF9F0A;
      --flat:#8E8E93;
      --sat:#409CFF;
      --sun:#FF453A;
      --blue:#0A84FF;
      --pink:#FF375F;
      --card-shadow:none;
      --glass-bg:rgba(44,44,46,0.55);
      --glass-border:rgba(255,255,255,0.08);
      --glass-shadow:0 10px 30px rgba(0,0,0,0.55), 0 1px 1px rgba(255,255,255,0.05) inset;
    
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%; background:var(--bg); font-family:var(--font);}
  body{display:block; min-height:100%; overflow:hidden; background:var(--bg); --system-top:0px; --system-bottom:0px;}

  .screen{
    position:absolute; inset:0;
    background:var(--bg);
    overflow:hidden;
  }

  .content{
    position:absolute; inset:0; overflow-y:auto; overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
    padding-top:calc(var(--system-top) + 16px);
    padding-bottom:132px;
  }
  .content::-webkit-scrollbar{display:none;}

  /* ---------- floating icon button (glass) ---------- */
  .icon-btn{
    position:absolute; z-index:25; right:16px;
    bottom:calc(14px + var(--system-bottom) + 76px);
    width:34px; height:34px; border-radius:17px;
    background:var(--glass-bg);
    backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    border:1px solid var(--glass-border);
    box-shadow:0 4px 14px rgba(0,0,0,0.08);
    display:flex; align-items:center; justify-content:center; color:var(--accent);
  }

  /* ---------- shared bits ---------- */
  .section{padding:0 16px; margin-top:20px;}
  .section:first-child{margin-top:4px;}
  .section-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:8px;}
  .section-title{font-size:14px; font-weight:600; color:var(--text-2); text-transform:uppercase; letter-spacing:0.02em;}
  .section-link{font-size:13px; color:var(--accent); font-weight:500; display:flex; align-items:center; gap:2px;}

  .card{background:var(--surface); border:1px solid var(--stroke); border-radius:14px; box-shadow:var(--card-shadow);}

  .pill-row{display:flex; gap:8px; overflow-x:auto; padding:0 16px 2px; scrollbar-width:none;}
  .pill-row::-webkit-scrollbar{display:none;}
  .pill{
    flex-shrink:0; padding:7px 14px; border-radius:100px; font-size:13.5px; font-weight:500;
    background:var(--surface); color:var(--text-2); border:1px solid var(--stroke);
    transition:all .15s ease;
  }
  .pill.active{background:var(--accent); color:#FFFFFF; border-color:var(--accent);}

  .badge{
    display:inline-flex; align-items:center; padding:3px 8px; border-radius:6px;
    font-size:10.5px; font-weight:600;
  }
  .badge.broadcast{background:rgba(0,122,255,0.12); color:var(--blue);}
  .badge.radio{background:rgba(142,142,147,0.14); color:var(--text-2);}
  .badge.event{background:rgba(255,45,85,0.12); color:var(--pink);}
  .badge.fansign{background:var(--accent-dim); color:var(--accent);}
  .badge.concert{background:rgba(255,45,85,0.12); color:var(--pink);}
  .badge.notice{background:var(--surface-2); color:var(--text-2);}

  .thumb{
    border-radius:10px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    background:var(--accent-dim); color:var(--accent); font-weight:600; font-size:14px; letter-spacing:-0.2px;
    overflow:hidden;
  }
  .thumb img{
    width:100%; height:100%; display:block; object-fit:cover; border-radius:inherit;
  }

  .chevron{color:var(--text-3); flex-shrink:0;}

  /* ---------- tab bar: liquid glass floating ---------- */
  .tabbar{
    position:absolute; left:18px; right:18px; bottom:calc(14px + var(--system-bottom));
    z-index:30; display:flex; align-items:center;
    padding:8px 6px;
    border-radius:30px;
    background:var(--glass-bg);
    backdrop-filter:blur(28px) saturate(190%);
    -webkit-backdrop-filter:blur(28px) saturate(190%);
    border:1px solid var(--glass-border);
    box-shadow:var(--glass-shadow);
  }
  .tab{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    color:var(--text-3); padding:7px 0; cursor:pointer;
    border-radius:22px; transition:background .15s ease, color .15s ease;
  }
  .tab svg{stroke:var(--text-3); transition:stroke .15s ease;}
  .tab span{font-size:10px; font-weight:500; transition:color .15s ease;}
  .tab.active{color:var(--accent); background:var(--accent-dim);}
  .tab.active svg{stroke:var(--accent);}
  .tab.active span{color:var(--accent);}

  /* ---------- HOME ---------- */
  .home-refresh-bar{
    display:flex; align-items:center; justify-content:space-between;
    padding:0 16px; margin-bottom:14px;
  }
  .home-refresh-time{font-size:12px; color:var(--text-3); font-weight:500;}
  .home-refresh-btn{
    display:flex; align-items:center; gap:5px;
    padding:6px 12px; border-radius:100px; border:1px solid var(--stroke);
    background:var(--surface); color:var(--accent); font-size:12.5px; font-weight:600;
    font-family:var(--font);
  }
  .home-refresh-btn svg{stroke:var(--accent);}
  .today-card{
    padding:14px 16px; display:flex; flex-direction:column; gap:10px;
  }
  .today-empty{
    padding:22px 16px; text-align:center; color:var(--text-3); font-size:13px;
  }
  .today-item{display:flex; align-items:center; gap:12px;}
  .today-item + .today-item{border-top:1px solid var(--divider); padding-top:10px; margin-top:0;}
  .today-item .content-col{flex:1; min-width:0;}
  .today-item .item-title{font-size:14.5px; font-weight:600; color:var(--text-1); margin-top:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .time-chip{
    background:var(--accent-dim); color:var(--accent); font-weight:600; font-size:12.5px;
    padding:5px 9px; border-radius:8px; flex-shrink:0;
  }

  .chart-mini-row{display:flex; align-items:center; gap:10px; padding:11px 14px;}
  .chart-mini-row + .chart-mini-row{border-top:1px solid var(--divider);}
  .chart-mini-row .thumb{width:42px !important; height:42px !important; border-radius:7px; overflow:hidden; flex-shrink:0; display:flex; align-items:center; justify-content:center; background:var(--surface-2); color:var(--text-2); font-weight:700;}
  .chart-mini-row .thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .mini-info{flex:1; min-width:0;}
  .mini-title{font-size:14px; font-weight:600; color:var(--text-1); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .mini-artist{font-size:12px; color:var(--text-3); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .mini-ranks{display:flex; flex-direction:column; gap:4px; flex-shrink:0; width:78px;}
  .mini-rank{display:flex; align-items:center; justify-content:space-between; gap:7px; padding:3px 7px; border-radius:6px; background:var(--surface-2); font-size:10px; color:var(--text-3); line-height:1.1;}
  .mini-rank b{font-size:12px; color:var(--text-1); font-weight:700;}

  .news-mini{display:flex; gap:12px; padding:12px 14px; align-items:center;}
  .news-mini + .news-mini{border-top:1px solid var(--divider);}
  .news-mini .n-title{font-size:13.5px; font-weight:600; color:var(--text-1); line-height:1.35;}
  .news-mini .n-meta{font-size:11.5px; color:var(--text-3); margin-top:5px;}

  /* ---------- CHART ---------- */
  .song-row{display:flex; align-items:center; gap:12px; padding:12px 16px;}
  .song-row + .song-row{border-top:1px solid var(--divider);}
  .song-info{flex:1; min-width:0;}
  .song-title{font-size:15px; font-weight:600; color:var(--text-1); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .song-artist{font-size:12.5px; color:var(--text-3); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .chip-wrap{display:flex; flex-wrap:wrap; gap:5px; margin-top:7px;}
  .plat-chip{
    background:var(--surface-2); border-radius:6px; padding:3px 6px; display:flex; align-items:center; gap:4px;
    font-size:10px; color:var(--text-2); font-weight:500; line-height:1;
  }
  .plat-chip .plat-label{display:inline-flex; align-items:center; line-height:1;}
  .plat-chip b{display:inline-flex; align-items:center; color:var(--text-1); font-size:11px; font-weight:600; line-height:1;}
  .chip-delta{display:inline-flex; align-items:center; font-size:9.5px; font-weight:700; line-height:1; margin-left:1px;}

  .platform-rank{
    width:50px; flex-shrink:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  }
  .platform-rank .prk-num{font-size:22px; font-weight:800; color:var(--text-1); letter-spacing:-0.4px; line-height:1;}
  .platform-rank .prk-delta{font-size:11.5px; font-weight:700; line-height:1;}

  /* ---------- NEWS ---------- */
  .article-row{display:flex; gap:13px; padding:13px 16px; align-items:center;}
  .article-row + .article-row{border-top:1px solid var(--divider);}
  .art-title{font-size:14.5px; font-weight:600; color:var(--text-1); line-height:1.38;}
  .art-meta{display:flex; align-items:center; gap:7px; margin-top:6px;}
  .art-source{display:inline-flex; align-items:center; font-size:11.5px; color:var(--text-2); font-weight:500; line-height:1;}
  .art-dot{width:2.5px; height:2.5px; border-radius:50%; background:var(--text-3); flex-shrink:0;}
  .art-date{display:inline-flex; align-items:center; font-size:11.5px; color:var(--text-3); line-height:1;}

  /* ---------- SCHEDULE ---------- */
  .sched-title{padding:2px 18px 2px; font-size:26px; font-weight:700; color:var(--text-1); letter-spacing:-0.4px;}
  .title-row{display:flex; align-items:center; gap:6px;}
  .title-info-btn{width:20px; height:20px; border-radius:10px; border:1.5px solid var(--text-3); background:transparent; color:var(--text-3); font-size:12px; font-weight:700; line-height:1; display:flex; align-items:center; justify-content:center; padding:0; flex-shrink:0;}
  .chart-info-row{display:flex; align-items:center; justify-content:space-between; padding:12px 4px;}
  .chart-info-row .platform{font-size:14px; font-weight:600; color:var(--text-1);}
  .chart-info-row .desc{font-size:13px; color:var(--text-2);}
  .chart-info-row+.chart-info-row{border-top:1px solid var(--divider);}
  .sched-sub{padding:4px 18px 2px; font-size:13px; color:var(--text-3); font-weight:500;}

  .date-group{margin-top:22px; padding:0 16px;}
  .date-group:first-of-type{margin-top:14px;}
  .date-header{display:flex; align-items:center; gap:8px; margin-bottom:9px; padding:0 4px;}
  .date-header .d1{display:inline-flex; align-items:center; font-size:14px; font-weight:700; color:var(--text-1); letter-spacing:-0.2px; line-height:1;}
  .date-header .d2{display:inline-flex; align-items:center; font-size:13px; font-weight:600; color:var(--text-3); line-height:1;}
  .date-header .d2.weekend-sat{color:var(--sat);}
  .date-header .d2.weekend-sun{color:var(--sun);}
  .date-header .today-tag{
    margin-left:auto; font-size:10.5px; font-weight:700; letter-spacing:0.02em;
    color:var(--accent); background:var(--accent-dim); padding:3px 8px; border-radius:100px;
  }

  .event-card{padding:0 14px; overflow:hidden;}
  .event-line{display:flex; align-items:flex-start; gap:12px; padding:13px 2px;}
  .event-line .chevron{margin-top:2px;}
  .event-search-btn{
    flex-shrink:0; width:24px; height:24px; margin-top:1px; border-radius:12px; border:none;
    background:var(--surface-2); color:var(--text-3); display:flex; align-items:center; justify-content:center;
    padding:0;
  }
  .event-search-btn:active{background:var(--accent-dim); color:var(--accent);}
  .event-line + .event-line{border-top:1px solid var(--divider);}
  .event-time{
    width:46px; flex-shrink:0; font-size:13px; font-weight:700; color:var(--text-1);
    letter-spacing:-0.3px; padding-top:1px;
  }
  .event-time.allday{font-size:11.5px; font-weight:600; color:var(--text-3);}
  .event-dot{width:7px; height:7px; border-radius:50%; background:var(--flat); flex-shrink:0; margin-top:6px;}
  .event-line.type-broadcast .event-dot{background:var(--blue);}
  .event-line.type-radio .event-dot{background:var(--text-3);}
  .event-line.type-event .event-dot,
  .event-line.type-concert .event-dot{background:var(--pink);}
  .event-line.type-fansign .event-dot{background:var(--accent);}
  .event-line.type-notice .event-dot{background:var(--text-3);}
  .event-main{flex:1; min-width:0;}
  .event-title{font-size:14.5px; font-weight:600; color:var(--text-1); line-height:1.35; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}
  .event-type{font-size:11.5px; color:var(--text-3); margin-top:4px; font-weight:500;}
  .sched-empty{margin:28px 16px; padding:44px 20px; text-align:center; color:var(--text-3); font-size:13.5px;}


  /* ---------- SETTINGS ---------- */
  .set-header{padding:4px 16px 2px;}
  .set-header h1{margin:0; font-size:28px; font-weight:700; color:var(--text-1); letter-spacing:-0.4px;}
  .set-header p{margin:6px 0 0; font-size:13.5px; color:var(--text-2); line-height:1.45;}
  .set-card{padding:14px 16px 16px;}
  .set-card-title{font-size:15.5px; font-weight:650; color:var(--text-1);}
  .set-card-desc{font-size:12.8px; color:var(--text-2); line-height:1.5; margin-top:5px;}
  .theme-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px;}
  .theme-opt{
    display:flex; flex-direction:column; align-items:center; gap:6px;
    padding:12px 6px; border-radius:12px; border:1.5px solid var(--stroke);
    background:var(--surface-2); color:var(--text-2); cursor:pointer;
    transition:border-color .15s ease, background .15s ease, color .15s ease;
  }
  .theme-opt svg{stroke:currentColor;}
  .theme-opt span{font-size:12.5px; font-weight:600;}
  .theme-opt[aria-checked="true"]{border-color:var(--accent); background:var(--accent-dim); color:var(--accent);}
  .set-status{
    margin-top:12px; display:flex; align-items:center; gap:8px;
    padding:10px 12px; border-radius:10px; background:var(--surface-2);
    font-size:12.5px; color:var(--text-2); line-height:1.4;
  }
  .status-dot{width:8px; height:8px; border-radius:5px; background:var(--flat); flex-shrink:0;}
  .status-dot.ok{background:var(--status-ok);}
  .status-dot.warn{background:var(--status-warn);}
  .set-btn{
    margin-top:12px; width:100%; padding:12px 14px; border-radius:12px; border:none;
    background:var(--accent); color:#FFFFFF; font-size:14.5px; font-weight:650;
    font-family:var(--font); display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .set-btn.secondary{background:var(--surface-2); color:var(--accent);}
  .set-steps{margin:12px 0 0; padding:0; list-style:none; counter-reset:step;}
  .set-steps li{
    counter-increment:step; position:relative; padding:0 0 0 26px; margin-top:8px;
    font-size:12.8px; color:var(--text-2); line-height:1.5;
  }
  .set-steps li::before{
    content:counter(step); position:absolute; left:0; top:1px;
    width:18px; height:18px; border-radius:9px; background:var(--accent-dim); color:var(--accent);
    font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center;
  }
  .set-note{
    display:flex; gap:10px; padding:13px 14px; border-radius:12px;
    background:var(--surface-2); border:1px solid var(--stroke);
  }
  .set-note svg{stroke:var(--text-2); flex-shrink:0; margin-top:1px;}
  .set-note p{margin:0; font-size:12.4px; color:var(--text-2); line-height:1.55;}
  .set-note b{color:var(--text-1); font-weight:650;}
  .set-foot{padding:16px; text-align:center; font-size:11.5px; color:var(--text-3);}

  /* utility */
  .row{display:flex; align-items:center;}
  .grow{flex:1; min-width:0;}
  .hidden{display:none !important;}
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:90;display:flex;align-items:flex-end;}
  .modal{width:100%;max-height:70%;background:var(--surface);border-radius:16px 16px 0 0;padding:8px 20px 28px;box-shadow:0 -8px 30px rgba(0,0,0,.16); overflow-y:auto;}
  .modal::before{content:"";display:block;width:36px;height:5px;border-radius:3px;background:var(--divider);margin:6px auto 14px;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .modal-title{font-size:18px;font-weight:700;color:var(--text-1);}
  .modal-close{border:none;background:var(--surface-2);color:var(--accent);border-radius:10px;padding:7px 12px;font-size:13px;font-weight:600;}
  .favorite-row{padding:12px 0;border-top:1px solid var(--divider);color:var(--text-1);font-size:14px;}

  .toast{
    position:fixed; left:50%; bottom:calc(14px + var(--system-bottom) + 78px);
    transform:translateX(-50%) translateY(6px);
    background:rgba(28,28,30,0.92); color:#FFFFFF; font-size:13px; font-weight:600;
    padding:10px 18px; border-radius:100px; z-index:80;
    opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease;
    white-space:nowrap;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

</style>
</head>
<body>

  <!-- ============ HOME ============ -->
  <div class="screen" id="screen-home">
    <div class="content" id="scroll-home">

      <div class="home-refresh-bar">
        <span class="home-refresh-time" id="home-refresh-time">불러오는 중…</span>
        <button class="home-refresh-btn" id="home-refresh-btn" type="button">

<script>
/* ---------------- data ---------------- */
const PLATFORM_LABEL={melon:"멜론",genie:"지니",vibe:"바이브",bugs:"벅스",flo:"플로",youtube_music:"유튜브뮤직",spotify:"스포티파이"};
const PLATFORM_ORDER=["melon","genie","vibe","bugs","flo","youtube_music","spotify"];
let nativeData={chart:{songs:[]},news:{articles:[]},schedule:{events:[]}};
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
function stripKoreanAlias(name){return String(name??"").replace(/\s*\([^()]*[\uac00-\ud7a3][^()]*\)\s*$/,"").trim();}
function weekdayLabel(n){return ["일","월","화","수","목","금","토"][n];}
function todayISO(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
function delta(x){if(!x)return{n:"—",d:"—",cls:"flat"};if(x.previousRank==null)return{n:String(x.rank),d:"NEW",cls:"flat"};const d=x.previousRank-x.rank;return d>0?{n:String(x.rank),d:`↑${d}`,cls:"up"}:d<0?{n:String(x.rank),d:`↓${-d}`,cls:"down"}:{n:String(x.rank),d:"—",cls:"flat"};}
function applyChartData(d){nativeData.chart=d||{songs:[]};renderChart(document.querySelector("#platform-pills .pill.active")?.dataset.p||"all");}
function renderChart(platform){const songs=[...(nativeData.chart?.songs||[])].filter(s=>platform==="all"||s.ranks?.[platform]);songs.sort((a,b)=>{const ra=platform==="all"?Math.min(...Object.values(a.ranks||{}).map(x=>x.rank||99999)):a.ranks[platform].rank;const rb=platform==="all"?Math.min(...Object.values(b.ranks||{}).map(x=>x.rank||99999)):b.ranks[platform].rank;return ra-rb;});document.getElementById("chart-list").innerHTML=songs.map((s,i)=>{const ranks=s.ranks||{};const chips=platform==="all"?`<div class="chip-wrap">${PLATFORM_ORDER.filter(k=>ranks[k]).map(k=>{const dm=delta(ranks[k]);return `<span class="plat-chip"><span class="plat-label">${PLATFORM_LABEL[k]}</span> <b>${ranks[k].rank}</b><span class="chip-delta" style="color:var(--${dm.cls})">${dm.d}</span></span>`;}).join("")}</div>`:"";const rightRank=platform!=="all"?(()=>{const dm=delta(ranks[platform]);return `<div class="platform-rank"><span class="prk-num">${ranks[platform]?.rank??"—"}</span><span class="prk-delta" style="color:var(--${dm.cls})">${dm.d}</span></div>`;})():"";return `<div class="song-row" data-song-id="${esc(s.songName+"|"+s.artistName)}"><div class="thumb" style="width:44px;height:44px;">${s.albumImageUrl?`<img src="${esc(s.albumImageUrl)}" alt="" onerror="this.remove()">`:`${esc((s.songName||"?").slice(0,1))}`}</div><div class="song-info"><div class="song-title">${esc(s.songName)}</div><div class="song-artist">${esc(stripKoreanAlias(s.artistName))}</div>${chips}</div>${rightRank}</div>`}).join("")||`<div class="today-empty">표시할 차트 데이터가 없습니다.</div>`;}
function applyNewsData(d){nativeData.news=d||{articles:[]};document.getElementById("news-list").innerHTML=(nativeData.news.articles||[]).map(a=>`<div class="article-row" data-url="${esc(a.url)}"><div class="thumb" style="width:56px;height:56px;">${a.thumbnail?`<img src="${esc(a.thumbnail)}" alt="" onerror="this.remove()">`:`${esc((a.source||"N").slice(0,1))}`}</div><div class="grow"><div class="art-title">${esc(a.title)}</div><div class="art-meta"><span class="art-source">${esc(a.source)}</span><span class="art-dot"></span><span class="art-date">${esc(a.date)}</span></div></div><svg class="chevron" width="7" height="12" viewBox="0 0 7 12" fill="none"><path d="M1 1L6 6L1 11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`).join("")||`<div class="today-empty">표시할 뉴스가 없습니다.</div>`;}
function applyScheduleData(d){
  nativeData.schedule=d||{events:[]};
  const by={};
  (nativeData.schedule.events||[]).forEach(e=>(by[e.date]??=[]).push(e));
  const dates=Object.keys(by).sort();
  const labels={broadcast:"방송",radio:"라디오",event:"행사",fansign:"팬사인회",concert:"공연",notice:"공지"};
  const sub=document.getElementById("sched-sub");
  const total=(nativeData.schedule.events||[]).length;
  if(sub) sub.textContent = total ? `예정된 일정 ${total}개` : "";
  const groups=document.getElementById("schedule-groups");
  if(!dates.length){groups.innerHTML=`<div class="card sched-empty">예정된 일정이 없습니다.</div>`;return;}
  groups.innerHTML=dates.map(date=>{
    const d=new Date(date+"T00:00:00");
    const cls=d.getDay()===6?"weekend-sat":d.getDay()===0?"weekend-sun":"";
    const isToday=date===todayISO();
    const items=[...by[date]].sort((a,b)=>(a.time||"99:99").localeCompare(b.time||"99:99"));
    return `<div class="date-group" id="date-${date}">
      <div class="date-header">
        <span class="d1">${d.getMonth()+1}월 ${d.getDate()}일</span>
        <span class="d2 ${cls}">${weekdayLabel(d.getDay())}</span>
        ${isToday?`<span class="today-tag">오늘</span>`:""}
      </div>
      <div class="card event-card">${items.map(e=>`<div class="event-line type-${esc(e.type||"notice")}">
        ${e.time?`<div class="event-time">${esc(e.time)}</div>`:""}
        <div class="event-dot"></div>
        <div class="event-main">
          <div class="event-title">${esc(e.title)}</div>
          <div class="event-type">${esc(labels[e.type]||e.type||"일정")}</div>
        </div>
        <button class="event-search-btn" type="button" data-search="${esc(e.title)}" aria-label="검색">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        </button>
      </div>`).join("")}</div>
    </div>`;
  }).join("");
}
function updateHome(){const ev=(nativeData.schedule.events||[]).filter(e=>e.date===todayISO()).sort((a,b)=>(a.time||"99:99").localeCompare(b.time||"99:99"));const tc=document.querySelector("#screen-home .today-card");tc.innerHTML=ev.map(e=>`<div class="today-item"><div class="content-col"><span class="badge ${esc(e.type)}">${esc(e.type||"일정")}</span><div class="item-title">${esc(e.title)}</div></div>${e.time?`<span class="time-chip">${esc(e.time)}</span>`:""}</div>`).join("")||`<div class="today-empty">오늘 예정된 일정이 없습니다.</div>`;const songs=[...(nativeData.chart.songs||[])].sort((a,b)=>Math.min(...Object.values(a.ranks||{}).map(x=>x.rank||99999))-Math.min(...Object.values(b.ranks||{}).map(x=>x.rank||99999))).slice(0,3);const cc=document.getElementById("home-chart-card");if(cc)cc.innerHTML=songs.map(s=>{const ranks=s.ranks||{},melon=ranks.melon?.rank??"—",ytm=ranks.youtube_music?.rank??"—",fallback=esc((s.songName||"?").slice(0,1));return `<div class="chart-mini-row"><div class="thumb">${s.albumImageUrl?`<img src="${esc(s.albumImageUrl)}" alt="" onerror="this.outerHTML='<span>${fallback}</span>'">`:`<span>${fallback}</span>`}</div><div class="mini-info"><div class="mini-title">${esc(s.songName)}</div><div class="mini-artist">${esc(s.artistName)}</div></div><div class="mini-ranks"><div class="mini-rank"><span style="color:#03dd30">멜론</span><b>${melon}</b></div><div class="mini-rank"><span style="color:#ff0033">유튜브 뮤직</span><b>${ytm}</b></div></div></div>`}).join("")||`<div class="today-empty">차트 데이터가 없습니다.</div>`;const n=nativeData.news.articles||[],nc=document.getElementById("home-news-card");if(nc)nc.innerHTML=n.slice(0,5).map(a=>`<div class="news-mini" data-url="${esc(a.url)}"><div class="thumb" style="width:52px;height:52px;">${a.thumbnail?`<img src="${esc(a.thumbnail)}" alt="" onerror="this.remove()">`:`${esc((a.source||"N").slice(0,1))}`}</div><div><div class="n-title">${esc(a.title)}</div><div class="n-meta">${esc(a.source)}${a.date?` · ${esc(a.date)}`:""}</div></div></div>`).join("")||`<div class="today-empty">뉴스 데이터가 없습니다.</div>`;}
let pendingRefreshToast=false;
let toastTimer=null;
function showToast(msg){
  let el=document.getElementById("app-toast");
  if(!el){el=document.createElement("div");el.id="app-toast";el.className="toast";document.body.appendChild(el);}
  el.textContent=msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove("show"),1800);
}
function updateRefreshTime(){const el=document.getElementById("home-refresh-time");if(!el)return;const d=new Date(),pad=n=>String(n).padStart(2,"0");el.textContent=`마지막 갱신 ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;}
window.SceneGetsWeb={
  onData:function(payload){try{nativeData=JSON.parse(payload);applyChartData(nativeData.chart);applyNewsData(nativeData.news);applyScheduleData(nativeData.schedule);updateHome();updateRefreshTime();if(pendingRefreshToast){pendingRefreshToast=false;showToast("갱신 완료");}}catch(e){console.error(e);}},
  applyTheme:function(t){applyTheme(t,false);}
};
renderChart("all");
updateHome();

/* ---------------- tab switching ---------------- */
const tabs = document.querySelectorAll('.tab');
const screens = {home:'screen-home', chart:'screen-chart', news:'screen-news', schedule:'screen-schedule', settings:'screen-settings'};
tabs.forEach(tab=>{
  tab.addEventListener('click', ()=>{
    tabs.forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    Object.values(screens).forEach(id=>document.getElementById(id).classList.add('hidden'));
    const targetScreen=document.getElementById(screens[tab.dataset.tab]);
    targetScreen.classList.remove('hidden');
    const content=targetScreen.querySelector('.content');
    if(content) content.scrollTop=0;
  });
});

// Functional navigation and real data actions.
function showFavorites(){let f=JSON.parse(localStorage.getItem("scenegets_favorites")||"[]");let rows=f.map(id=>`<div class="favorite-row">${esc((id||"").replace(/^song:/,""))}</div>`).join("")||'<div class="today-empty">저장된 즐겨찾기가 없습니다.</div>';let b=document.createElement("div");b.className="modal-backdrop";b.innerHTML=`<div class="modal"><div class="modal-head"><span class="modal-title">즐겨찾기</span><button class="modal-close" type="button">닫기</button></div>${rows}</div>`;b.addEventListener("click",e=>{if(e.target===b||e.target.closest(".modal-close"))b.remove();});document.body.appendChild(b);}
const CHART_INFO=[["멜론","TOP 100"],["유튜브 뮤직","주간 인기곡"],["스포티파이","한국 데일리 차트"],["지니","TOP 200"],["플로","전체 연령 차트"],["벅스","실시간 차트"],["바이브","오늘 TOP 100"]];
function showChartInfo(){const rows=CHART_INFO.map(([p,d])=>`<div class="chart-info-row"><span class="platform">${esc(p)}</span><span class="desc">${esc(d)}</span></div>`).join("");let b=document.createElement("div");b.className="modal-backdrop";b.innerHTML=`<div class="modal"><div class="modal-head"><span class="modal-title">차트 안내</span><button class="modal-close" type="button">닫기</button></div>${rows}</div>`;b.addEventListener("click",e=>{if(e.target===b||e.target.closest(".modal-close"))b.remove();});document.body.appendChild(b);}
document.getElementById("chart-info-btn")?.addEventListener("click",showChartInfo);
document.addEventListener("click",e=>{const action=e.target.closest("[data-action]")?.dataset.action;if(action){const tab=document.querySelector(`.tab[data-tab="${action}"]`);if(tab)tab.click();if(action==="favorites")showFavorites();return;}const a=e.target.closest(".article-row,.news-mini");if(a?.dataset.url&&window.SceneGetsBridge)window.SceneGetsBridge.openUrl(a.dataset.url);const song=e.target.closest(".song-row");if(song)toggleFavorite(song.dataset.songId);const ev=e.target.closest(".event-search-btn");if(ev?.dataset.search&&window.SceneGetsBridge)window.SceneGetsBridge.openUrl("https://www.google.com/search?q="+encodeURIComponent(ev.dataset.search));});
function toggleFavorite(id){let f=JSON.parse(localStorage.getItem("scenegets_favorites")||"[]"),i=f.indexOf("song:"+id);if(i>=0)f.splice(i,1);else f.push("song:"+id);localStorage.setItem("scenegets_favorites",JSON.stringify(f));}
document.getElementById("chart-refresh")?.addEventListener("click",()=>{pendingRefreshToast=true;window.SceneGetsBridge&&window.SceneGetsBridge.refreshAll();});
document.getElementById("home-refresh-btn")?.addEventListener("click",()=>{const el=document.getElementById("home-refresh-time");if(el)el.textContent="갱신 중…";pendingRefreshToast=true;window.SceneGetsBridge&&window.SceneGetsBridge.refreshAll();});
document.getElementById("platform-pills").addEventListener("click",e=>{const p=e.target.closest(".pill");if(!p)return;document.querySelectorAll("#platform-pills .pill").forEach(x=>x.classList.remove("active"));p.classList.add("active");renderChart(p.dataset.p);});
window.addEventListener("load",()=>window.SceneGetsBridge&&window.SceneGetsBridge.refreshAll());

/* ---------------- settings: theme & battery ---------------- */
const THEME_KEY="scenegets_theme";
const THEME_TEXT={light:"항상 밝은 화면으로 표시됩니다.",dark:"항상 어두운 화면으로 표시됩니다.",system:"기기의 시스템 설정을 따릅니다."};
function currentTheme(){
  let t=null;
  try{ if(window.SceneGetsBridge&&window.SceneGetsBridge.getTheme) t=window.SceneGetsBridge.getTheme(); }catch(e){}
  if(!t){ try{ t=localStorage.getItem(THEME_KEY); }catch(e){} }
  return (t==="light"||t==="dark")?t:"system";
}
function applyTheme(t,persist){
  const root=document.documentElement;
  let visualTheme=t;
  if(t==="system"){
    try{
      visualTheme=(window.SceneGetsBridge&&window.SceneGetsBridge.getResolvedTheme)
        ? window.SceneGetsBridge.getResolvedTheme() : "light";
    }catch(e){ visualTheme="light"; }
  }
  root.setAttribute("data-theme",visualTheme);
  document.querySelectorAll("#theme-grid .theme-opt").forEach(o=>o.setAttribute("aria-checked",String(o.dataset.theme===t)));
  const st=document.getElementById("theme-status"); if(st) st.textContent=THEME_TEXT[t];
  if(persist){
    try{ localStorage.setItem(THEME_KEY,t); }catch(e){}
    // 네이티브 설정을 먼저 갱신한 뒤 다시 적용한다. 특히 dark -> system 전환 시
    // 네이티브가 새 시스템 테마를 기준으로 해석하도록 한다.
    try{
      if(window.SceneGetsBridge&&window.SceneGetsBridge.setTheme){
        window.SceneGetsBridge.setTheme(t);
      } else {
        applyTheme(t,false);
      }
    }catch(e){ applyTheme(t,false); }
  }
}
document.getElementById("theme-grid")?.addEventListener("click",e=>{
  const o=e.target.closest(".theme-opt"); if(!o)return; applyTheme(o.dataset.theme,true);
});
applyTheme(currentTheme(),false);

function refreshBatteryStatus(){
  const dot=document.getElementById("batt-dot"), txt=document.getElementById("batt-status");
  if(!dot||!txt)return;
  let state=null;
  try{ if(window.SceneGetsBridge&&window.SceneGetsBridge.isBatteryUnrestricted) state=window.SceneGetsBridge.isBatteryUnrestricted(); }catch(e){}
  dot.className="status-dot"+(state===true?" ok":state===false?" warn":"");
  txt.textContent = state===true
    ? "제한 없음으로 설정되어 있어요. 위젯이 정상적으로 새로고침됩니다."
    : state===false
      ? "현재 배터리 최적화가 적용 중이에요. 위젯 새로고침이 지연될 수 있어요."
      : "Android 앱에서만 확인할 수 있는 설정이에요.";
}
document.getElementById("batt-open")?.addEventListener("click",()=>{
  if(window.SceneGetsBridge&&window.SceneGetsBridge.openBatterySettings) window.SceneGetsBridge.openBatterySettings();
  else { const t=document.getElementById("batt-status"); if(t) t.textContent="이 설정은 Android 앱에서만 열 수 있어요."; }
});
document.getElementById("batt-recheck")?.addEventListener("click",refreshBatteryStatus);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) refreshBatteryStatus(); });
window.SceneGetsWeb=window.SceneGetsWeb||{};
window.SceneGetsWeb.onResume=function(){ refreshBatteryStatus(); };
refreshBatteryStatus();


</script>
